name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # ✅ 构建前检查：缺 env 直接报错，不浪费构建时间
      - name: Check env
        run: |
          node -e "
            const required = [
              'VITE_CSYOS_BACKEND_URL',
              'VITE_CSYOS_BACKEND_TOKEN',
              'VITE_CSYOS_TTS_WS_PROXY_URL',
              'VITE_CSYOS_FRONTEND_ORIGIN'
            ];
            const missing = required.filter(k => !process.env[k]);
            missing.forEach(k => console.log('❌ Missing:', k));
            if (missing.length) {
              console.error('致命：缺少以下环境变量，APK 构建出来也是废的');
              process.exit(1);
            }
            console.log('✅ 所有环境变量已就绪');
          "
        env:
          VITE_CSYOS_BACKEND_URL: ${{ secrets.VITE_CSYOS_BACKEND_URL }}
          VITE_CSYOS_BACKEND_TOKEN: ${{ secrets.VITE_CSYOS_BACKEND_TOKEN }}
          VITE_CSYOS_TTS_WS_PROXY_URL: ${{ secrets.VITE_CSYOS_TTS_WS_PROXY_URL }}
          VITE_CSYOS_FRONTEND_ORIGIN: ${{ secrets.VITE_CSYOS_FRONTEND_ORIGIN }}

      # ✅ 构建时注入 env（Vite 是 build-time 注入）
      - name: Build web app
        run: npm run build
        env:
          VITE_CSYOS_BACKEND_URL: ${{ secrets.VITE_CSYOS_BACKEND_URL }}
          VITE_CSYOS_BACKEND_TOKEN: ${{ secrets.VITE_CSYOS_BACKEND_TOKEN }}
          VITE_CSYOS_TTS_WS_PROXY_URL: ${{ secrets.VITE_CSYOS_TTS_WS_PROXY_URL }}
          VITE_CSYOS_FRONTEND_ORIGIN: ${{ secrets.VITE_CSYOS_FRONTEND_ORIGIN }}
          CI: false

      # ✅ 验证：确认 env 真的被写进 dist 了
      - name: Verify build output
        run: |
          if grep -q "undefined" dist/assets/*.js 2>/dev/null; then
            echo "⚠️ 警告：dist 里可能含有 undefined 的 env 引用"
          else
            echo "✅ dist 构建输出看起来正常"
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Release v0.1.${{ github.run_number }}
          body: |
            Sully-CSY Android APK 自动构建
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - Commit: ${{ github.sha }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
