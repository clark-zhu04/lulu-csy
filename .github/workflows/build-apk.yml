name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ===== Node.js 环境 =====
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      # ===== Capacitor 同步 =====
      - name: Sync Capacitor Android
        run: npx cap sync android

      # ===== 显式设置 Android SDK 路径 =====
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      # ===== Java 环境：改为 21（匹配 Capacitor 的要求） =====
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ===== Gradle 设置（使用 wrapper 中的版本 8.14.3，与 Java 21 兼容） =====
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        # 无需指定版本，自动读取 gradle-wrapper.properties

      # ===== 构建 Debug APK（带 stacktrace 方便排查） =====
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # ===== 上传构建产物 =====
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ===== 创建 Release =====
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Release v0.1.${{ github.run_number }}
          body: |
            Sully-CSY Android APK 自动构建
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - Commit: ${{ github.sha }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
